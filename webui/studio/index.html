<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoSense Studio | Repository Review Workbench</title>
  <link rel="stylesheet" href="/static/reposense.css">
  <link rel="stylesheet" href="/app-shell.css">
  <link rel="stylesheet" href="/artifact-cards.css">
</head>
<body>
  <div class="workbench-shell">
    <aside class="workbench-sidebar" aria-label="Studio navigation">
      <div class="brand-lockup">
        <span class="brand-mark">RS</span>
        <span><strong>RepoSense</strong><small>Review Workbench</small></span>
      </div>
      <nav class="primary-nav">
        <button type="button" data-view="home" class="active">Home</button>
        <button type="button" data-view="analyze">Analyze Repository</button>
        <button type="button" data-view="runs">Recent Runs</button>
        <button type="button" data-view="workbench">Review Workspace</button>
        <button type="button" data-view="learn">Learn</button>
        <button type="button" data-view="documentation">Documentation</button>
      </nav>
      <div class="sidebar-boundary">
        <span>LOCAL WORKSPACE</span>
        <p>Static analysis only. Repository code is not executed.</p>
        <small>Version 0.1.0</small>
      </div>
    </aside>

    <section class="workbench-stage">
      <header class="workbench-topbar">
        <div>
          <p id="page-kicker">Repository Review Workbench</p>
          <h1 id="page-title">Home</h1>
        </div>
        <div id="topbar-status" class="topbar-status"></div>
        <div id="topbar-actions" class="topbar-actions"></div>
      </header>
      <main id="studio-view" class="workbench-content" tabindex="-1" data-artifact-mount="current-artifact-cards">
        <div class="loading-panel">Loading local runs...</div>
      </main>
    </section>
  </div>

  <script src="/artifact-cards.js" defer></script>
  <script src="/analyze-form.js" defer></script>
  <script src="/run-workbench.js" defer></script>
  <script src="/app-shell.js" defer></script>
</body>
</html>
